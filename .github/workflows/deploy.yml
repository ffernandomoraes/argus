# Publica na Cloudflare o que não vai dentro do instalador do Argus, quando muda na main:
# - o recebimento dos dados de uso e o painel (apps/telemetry, Worker argus-telemetry);
# - a ponte do acesso remoto com o app do celular (apps/relay + apps/mobile, Worker argus-relay).
# Cada um só publica se algo dele mudou no push, e só depois de os testes passarem. Na mão (aba
# Actions, "Run workflow", ou gh workflow run deploy.yml), publica os dois.
# O site (apps/website) ainda não tem hospedagem: não entra aqui.
# Precisa dos secrets CLOUDFLARE_API_TOKEN (token da conta com permissão de editar Workers e D1) e
# CLOUDFLARE_ACCOUNT_ID. Sem eles, nada é publicado e o run avisa.
name: Publicar na Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/telemetry/**'
      - 'apps/relay/**'
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez: a que chega durante outra espera, sem cancelar a que está no meio.
concurrency: deploy-cloudflare

env:
  # A mesma versão usada na máquina de desenvolvimento.
  WRANGLER: wrangler@4.158.0

jobs:
  # O que mudou neste push e se os secrets existem.
  changes:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
      telemetry: ${{ steps.diff.outputs.telemetry }}
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secrets da Cloudflare
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltam os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID: nada foi publicado."
          fi

      # Os arquivos entre o commit anterior da main e este. Disparo na mão, ou sem o commit anterior
      # (histórico reescrito): publica os dois.
      - name: O que mudou
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "telemetry=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          changed() { if echo "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          echo "telemetry=$(changed '^apps/telemetry/')" >> "$GITHUB_OUTPUT"
          echo "mobile=$(changed '^(apps/(relay|mobile)|packages/(shared|ui))/|^pnpm-lock\.yaml$')" >> "$GITHUB_OUTPUT"

  # Os mesmos testes do release (o do app do celular contra o desktop e o do painel contra o que o
  # app envia estão entre eles). Vermelho, nada é publicado.
  checks:
    needs: changes
    if: needs.changes.outputs.configured == 'true' && (needs.changes.outputs.telemetry == 'true' || needs.changes.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Testes
        run: pnpm test

  telemetry:
    needs: [changes, checks]
    if: needs.changes.outputs.telemetry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/telemetry
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Antes do código: o Worker novo pode depender de uma coluna nova. Sem migração pendente, não faz nada.
      - name: Banco de dados
        run: npx --yes "$WRANGLER" d1 migrations apply argus-telemetry --remote

      - name: Publicar o painel
        run: npx --yes "$WRANGLER" deploy

  # A ponte serve o app do celular (apps/relay/public, montado aqui).
  mobile:
    needs: [changes, checks]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --filter "@argus/mobile..."

      - name: Conferir os tipos
        run: pnpm --filter @argus/mobile typecheck

      - name: Montar o app do celular
        run: pnpm mobile:build

      - name: Publicar a ponte e o app do celular
        working-directory: apps/relay
        run: npx --yes "$WRANGLER" deploy
