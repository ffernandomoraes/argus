# Gera uma versão nova, tudo ou nada, em três fases:
# 1. testes (pnpm test) no Mac, no Windows e no Linux;
# 2. montar e conferir, sem publicar nada: o .dmg e o .zip do Mac (Apple Silicon, assinado), o
#    instalador .exe do Windows e o AppImage do Linux, cada um abrindo o app no teste de abertura; e,
#    se mudaram, o app do celular, a ponte e o painel de dados de uso, montados a seco;
# 3. publicar, só se a fase 2 passou inteira: commit da versão, tag, release do GitHub com os três
#    instaladores juntos e, depois, a Cloudflare.
# Qualquer falha antes da fase 3 não publica nada: quem usa continua na versão anterior, inteira.
# Roda sozinho a cada push na main (sobe o patch; notas = commits desde a última tag).
# Na mão, pela aba Actions ("Run workflow") ou: gh workflow run release.yml -f bump=minor -f notas="- item"
# Com publicar=false só monta e guarda o .dmg, o .exe e o AppImage no run, sem tag, release nem Cloudflare.
name: Release

on:
  push:
    branches: [main]
    # Só texto (README, anotações) e o site: não vira versão.
    paths-ignore: ['**.md', 'apps/website/**']
  workflow_dispatch:
    inputs:
      bump:
        description: Que parte da versão subir
        type: choice
        options: [patch, minor, major]
        default: patch
      publicar:
        description: Publicar o release (desmarcado = só monta o app, para testar)
        type: boolean
        default: true
      notas:
        description: O que mudou, em tópicos ("- item" por linha). Vazio = lista os commits desde a última tag
        type: string
        default: ''

permissions:
  contents: write

# Um release por vez. Pushes que chegam durante um release esperam; se vierem vários, só o
# último fica na fila, e ele publica tudo de uma vez.
concurrency: release

env:
  # Wrangler dos jobs da Cloudflare: a mesma versão usada na máquina de desenvolvimento.
  WRANGLER: wrangler@4.158.0

jobs:
  # Escolhe o commit e o número da versão uma vez só, para o Mac e o Windows montarem o mesmo.
  versao:
    # O commit "Versão X" que este workflow envia não dispara outro release. O GitHub já não
    # dispara com pushes feitos pelo próprio Actions; isto é só a garantia.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Versão ') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      # No push não há as opções do disparo manual: sobe o patch.
      BUMP: ${{ inputs.bump || 'patch' }}
    steps:
      # A main como está agora, não a do push que disparou: um run que esperou na fila
      # pega o commit de versão do anterior e o que chegou depois.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Próxima versão
        id: version
        run: |
          next=$(node -e '
            const [major, minor, patch] = require("./apps/desktop/package.json").version.split(".").map(Number)
            const bump = process.argv[1]
            console.log(bump === "major" ? `${major + 1}.0.0` : bump === "minor" ? `${major}.${minor + 1}.0` : `${major}.${minor}.${patch + 1}`)
          ' "$BUMP")
          if git rev-parse "v$next" >/dev/null 2>&1; then
            echo "A tag v$next já existe." >&2
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Testes do núcleo (conversas, sessões, histórico, projetos, caminhos) nos três sistemas, no
  # commit escolhido. Um vermelho em qualquer um segura a versão inteira: os jobs que montam
  # esperam este, e o que publica espera todos eles.
  testes:
    needs: versao
    strategy:
      # Um sistema falhando não cancela os outros: o relatório mostra todos que quebraram.
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versao.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Sem os scripts de instalação: os testes não abrem o Electron nem usam as partes nativas
      # (terminal, ditado), e pular o download e a compilação deixa o job em ~1 min.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Padrão de código (eslint.config.mjs). Uma vez só: o resultado não muda com o sistema.
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint

      - name: Testes
        run: pnpm test

  # --- Montar e conferir, sem publicar nada ---
  # Mac, Windows e Linux montam ao mesmo tempo, cada um na sua máquina, e cada um abre o app no teste
  # de abertura. A Cloudflare monta a seco (cloudflare-conferir). Só se tudo passar o job publicar
  # cria a versão: um que falhe segura todos, e quem usa continua na versão anterior, inteira.

  # App do Mac (.dmg e .zip, Apple Silicon), assinado.
  mac:
    needs: [versao, testes]
    runs-on: macos-15
    # O app do desktop mora em apps/desktop (monorepo): os comandos rodam de lá.
    defaults:
      run:
        working-directory: apps/desktop
    env:
      VERSION: ${{ needs.versao.outputs.version }}
    steps:
      # O commit escolhido no job versao. persist-credentials: false: o token não fica no
      # .git/config enquanto as dependências instalam (um pacote com script poderia lê-lo).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versao.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Versão
        run: npm pkg set version="$VERSION"

      # O binário do Electron (baixado no postinstall e usado pelo electron-builder). Mudou o
      # lockfile, começa do zero: assim versões antigas do Electron não se acumulam no cache.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Conferir os tipos
        working-directory: .
        run: pnpm typecheck

      # O postinstall compila o programa do ditado (apps/desktop/native/speech) e só avisa se falhar: sem ele,
      # o app sairia sem ditado no Mac.
      - name: Conferir o programa do ditado
        run: test -x native/speech/build/speech-helper

      # Detector de travamento do Sentry: o binário dele é compilado para o Electron deste projeto
      # (o pacote só traz o do Node). Ver apps/desktop/scripts/sentryNative.mjs.
      - name: Compilar o detector de travamento
        run: node scripts/sentryNative.mjs

      # Com os secrets do certificado, o app sai assinado sempre com a mesma identidade e o macOS
      # não pede de novo microfone e ditado a cada versão. Sem eles, a montagem para (ver
      # apps/desktop/scripts/sign.mjs): um release ad-hoc seria recusado pelo atualizador de todos os Macs.
      - name: Importar certificado de assinatura
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "Sem certificado: a montagem vai parar na assinatura (apps/desktop/scripts/sign.mjs)."
            exit 0
          fi
          keychain="$RUNNER_TEMP/argus.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Certificado autoassinado: confiar nele para assinatura de código nesta máquina.
          security find-certificate -c "$MAC_SIGN_IDENTITY" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm "$RUNNER_TEMP/cert.p12"
          echo "MAC_SIGN_IDENTITY=$MAC_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Montar o app
        # Sobe os mapas de código para o Sentry e os apaga antes do instalador (ver
        # apps/desktop/electron.vite.config.ts). Sem o secret, monta igual, sem os mapas.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm exec electron-vite build && pnpm exec electron-builder --mac --arm64 --publish never

      # Mesmo certificado em todas as versões = o macOS não pede as permissões de novo.
      - name: Conferir assinatura
        run: |
          codesign --verify --deep --strict dist/mac-arm64/Argus.app
          codesign -d -r- dist/mac-arm64/Argus.app 2>&1 | tee /dev/stderr | grep -qE 'certificate (leaf|root)'

      # Mesmo teste do job do Windows (--smoke-test, ver apps/desktop/src/main/smokeTest.ts): abre o app, espera o
      # canvas, abre um terminal e fecha. Se não passar, não há versão. O macOS não tem o
      # `timeout`: a espera de 3 minutos é feita aqui.
      - name: Testar se o app abre
        run: |
          dist/mac-arm64/Argus.app/Contents/MacOS/Argus --smoke-test &
          pid=$!
          for _ in $(seq 360); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid"
            cat "${TMPDIR:-/tmp}/argus-smoke.log" 2>/dev/null || true
            echo "O app não terminou o teste a tempo." >&2
            exit 1
          fi
          code=0
          wait "$pid" || code=$?
          cat "${TMPDIR:-/tmp}/argus-smoke.log" 2>/dev/null || true
          if [ "$code" -ne 0 ]; then
            echo "O app falhou no teste (código $code)." >&2
            exit 1
          fi

      # Publicando, o job publicar pega daqui e a cópia some em 1 dia (os arquivos ficam no
      # release); testando, fica para baixar no run pelo prazo padrão do repositório (0).
      - name: Guardar o app
        uses: actions/upload-artifact@v7
        with:
          name: Argus-Mac-${{ env.VERSION }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          retention-days: ${{ (github.event_name == 'push' || inputs.publicar) && 1 || 0 }}

  # Instalador do Windows (.exe), numa máquina Windows do GitHub, ao mesmo tempo que o do Mac.
  # Antes de guardar, abre o app em modo de teste (--smoke-test, ver apps/desktop/src/main/smokeTest.ts): se ele
  # nem abrir, a versão não sai (para nenhum sistema).
  windows:
    needs: [versao, testes]
    runs-on: windows-latest
    # Ocupa a mesma fila dos releases (concurrency): travado, não pode segurar o próximo do Mac.
    timeout-minutes: 30
    # O app do desktop mora em apps/desktop (monorepo): os comandos rodam de lá.
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    env:
      VERSION: ${{ needs.versao.outputs.version }}
    steps:
      # O mesmo commit do Mac; a versão é trocada aqui (a tag só existe depois do job publicar).
      # Sem token no .git/config (ver o job do Mac): este job não faz push.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versao.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Versão
        run: npm pkg set version="$VERSION"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Detector de travamento do Sentry: o binário dele é compilado para o Electron deste projeto
      # (o pacote só traz o do Node). Ver apps/desktop/scripts/sentryNative.mjs.
      - name: Compilar o detector de travamento
        run: node scripts/sentryNative.mjs

      # Sem certificado de assinatura: o Windows avisa na primeira instalação (ver apps/desktop/electron-builder.yml).
      - name: Montar o instalador
        # Sobe os mapas de código para o Sentry e os apaga antes do instalador (ver
        # apps/desktop/electron.vite.config.ts). Sem o secret, monta igual, sem os mapas.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm exec electron-vite build && pnpm exec electron-builder --win --x64 --publish never

      - name: Testar se o app abre
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'dist\win-unpacked\Argus.exe' -ArgumentList '--smoke-test' -PassThru
          # Sem guardar o handle, o PowerShell perde o código de saída do processo.
          $null = $app.Handle
          $done = $app.WaitForExit(180000)
          Get-Content "$env:TEMP\argus-smoke.log" -ErrorAction SilentlyContinue
          if (-not $done) { $app.Kill(); throw 'O app não terminou o teste a tempo.' }
          if ($app.ExitCode -ne 0) { throw "O app falhou no teste (código $($app.ExitCode))." }

      # Publicando, o job publicar pega daqui e a cópia some em 1 dia (o .exe fica no
      # release); testando, fica para baixar no run pelo prazo padrão do repositório (0).
      - name: Guardar o instalador
        uses: actions/upload-artifact@v7
        with:
          name: Argus-Setup-${{ env.VERSION }}
          path: apps/desktop/dist/Argus-Setup-*.exe
          retention-days: ${{ (github.event_name == 'push' || inputs.publicar) && 1 || 0 }}

  # AppImage do Linux, numa máquina Ubuntu do GitHub, ao mesmo tempo que os outros. Mesmo teste de
  # abertura (--smoke-test), numa tela virtual (xvfb): sem passar, a versão não sai.
  linux:
    needs: [versao, testes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # O app do desktop mora em apps/desktop (monorepo): os comandos rodam de lá.
    defaults:
      run:
        working-directory: apps/desktop
    env:
      VERSION: ${{ needs.versao.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versao.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Versão
        run: npm pkg set version="$VERSION"

      # O postinstall compila o terminal (node-pty) com o build-essential que já vem na máquina.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Conferir o terminal
        run: test -f node_modules/node-pty/build/Release/pty.node

      # Detector de travamento do Sentry: o binário dele é compilado para o Electron deste projeto
      # (o pacote só traz o do Node). Ver apps/desktop/scripts/sentryNative.mjs.
      - name: Compilar o detector de travamento
        run: node scripts/sentryNative.mjs

      - name: Montar o AppImage
        # Sobe os mapas de código para o Sentry e os apaga antes do instalador (ver
        # apps/desktop/electron.vite.config.ts). Sem o secret, monta igual, sem os mapas.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm exec electron-vite build && pnpm exec electron-builder --linux --x64 --publish never

      - name: Testar se o app abre
        run: |
          code=0
          timeout 180 xvfb-run -a dist/linux-unpacked/argus --smoke-test || code=$?
          cat "${TMPDIR:-/tmp}/argus-smoke.log" 2>/dev/null || true
          if [ "$code" -ne 0 ]; then
            echo "O app falhou no teste (código $code)." >&2
            exit 1
          fi

      - name: Guardar o AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Argus-Linux-${{ env.VERSION }}
          path: apps/desktop/dist/Argus-*.AppImage
          retention-days: ${{ (github.event_name == 'push' || inputs.publicar) && 1 || 0 }}

  # --- Cloudflare: o que não vai dentro do instalador ---
  # O recebimento dos dados de uso e o painel (apps/telemetry, Worker argus-telemetry) e a ponte do
  # acesso remoto com o app do celular (apps/relay + apps/mobile, Worker argus-relay). Cada um só se
  # algo dele mudou desde a última versão. Antes era um workflow à parte, com testes só no Linux: em
  # 2026-11-14 o app do celular saiu enquanto um teste do Windows segurava a versão.
  # Precisa dos secrets CLOUDFLARE_API_TOKEN (token da conta com permissão de editar Workers e D1) e
  # CLOUDFLARE_ACCOUNT_ID. Sem eles, nada é publicado na Cloudflare e o run avisa. O site
  # (apps/website) ainda não tem hospedagem: não entra aqui.

  # O que mudou desde a última versão publicada (a última tag antes deste commit) e se os secrets
  # existem. Comparar com a tag, e não com o push anterior, cobre os pushes que esperaram juntos na
  # fila e a versão anterior que não saiu (o que ela trazia é publicado agora).
  cloudflare-mudancas:
    needs: versao
    if: ${{ github.event_name == 'push' || inputs.publicar }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
      telemetry: ${{ steps.diff.outputs.telemetry }}
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versao.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Secrets da Cloudflare
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltam os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID: nada foi publicado na Cloudflare."
          fi

      # Sem tag nenhuma antes (não deveria acontecer): publica os dois.
      - name: O que mudou
        id: diff
        run: |
          if ! prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null); then
            echo "telemetry=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$prev" HEAD)
          changed() { if echo "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          echo "telemetry=$(changed '^apps/telemetry/')" >> "$GITHUB_OUTPUT"
          echo "mobile=$(changed '^(apps/(relay|mobile)|packages/(shared|ui))/|^pnpm-lock\.yaml$')" >> "$GITHUB_OUTPUT"

  # Monta a seco o que vai para a Cloudflare (sem login e sem publicar): o app do celular com os tipos
  # conferidos, e o código de cada Worker empacotado como no deploy. Falhando, a versão não sai.
  cloudflare-conferir:
    needs: [versao, testes, cloudflare-mudancas]
    if: needs.cloudflare-mudancas.outputs.configured == 'true' && (needs.cloudflare-mudancas.outputs.telemetry == 'true' || needs.cloudflare-mudancas.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TELEMETRY: ${{ needs.cloudflare-mudancas.outputs.telemetry }}
      MOBILE: ${{ needs.cloudflare-mudancas.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versao.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        if: env.MOBILE == 'true'
        run: pnpm install --frozen-lockfile --filter "@argus/mobile..."

      - name: Conferir os tipos do app do celular
        if: env.MOBILE == 'true'
        run: pnpm --filter @argus/mobile typecheck

      - name: Montar o app do celular
        if: env.MOBILE == 'true'
        run: pnpm mobile:build

      - name: Empacotar a ponte
        if: env.MOBILE == 'true'
        working-directory: apps/relay
        run: npx --yes "$WRANGLER" deploy --dry-run --outdir "$RUNNER_TEMP/relay"

      - name: Empacotar o painel
        if: env.TELEMETRY == 'true'
        working-directory: apps/telemetry
        run: npx --yes "$WRANGLER" deploy --dry-run --outdir "$RUNNER_TEMP/telemetry"

  # --- Publicar: só com tudo montado e conferido ---
  # Commit da versão, tag e release com os instaladores dos três sistemas de uma vez (antes o do Mac
  # saía primeiro, e o Windows e o Linux eram anexados depois, se dessem certo). cloudflare-conferir
  # pulado (nada mudou lá) não segura; falhando, sim.
  publicar:
    needs: [versao, mac, windows, linux, cloudflare-mudancas, cloudflare-conferir]
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' || inputs.publicar)
      && needs.cloudflare-mudancas.result == 'success'
      && needs.mac.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success'
      && (needs.cloudflare-conferir.result == 'success' || needs.cloudflare-conferir.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      VERSION: ${{ needs.versao.outputs.version }}
    steps:
      # fetch-depth: 0: as notas listam os commits desde a última tag. Sem token no .git/config:
      # ele entra só no push da versão.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versao.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: Argus-Mac-${{ env.VERSION }}
          path: release-files

      - uses: actions/download-artifact@v8
        with:
          name: Argus-Setup-${{ env.VERSION }}
          path: release-files

      - uses: actions/download-artifact@v8
        with:
          name: Argus-Linux-${{ env.VERSION }}
          path: release-files

      # --atomic: ou vão o commit e a tag juntos, ou nenhum dos dois. O token vai só neste push
      # (o checkout não o guardou): no endereço, sem ficar gravado no repositório.
      - name: Commit da versão e tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pkg set version="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Versão $VERSION"
          git tag "v$VERSION"
          git push --atomic "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}" "refs/tags/v$VERSION"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ inputs.notas }}
        run: |
          notas="$RUNNER_TEMP/notas.md"
          if [ -n "$NOTAS" ]; then
            printf '%s\n' "$NOTAS" > "$notas"
          else
            prev=$(git tag --sort=-v:refname | grep -vx "v$VERSION" | head -1)
            git log --format='- %s' "$prev..HEAD" | grep -v '^- Versão ' > "$notas" || echo "- Ajustes internos" > "$notas"
          fi
          gh release create "v$VERSION" \
            ../../release-files/*.dmg ../../release-files/*.zip \
            ../../release-files/Argus-Setup-*.exe ../../release-files/Argus-*.AppImage \
            --title "Argus $VERSION" \
            --notes-file "$notas"

  # Depois do release: a Cloudflare recebe o mesmo commit da versão que acabou de sair.
  cloudflare:
    needs: [versao, cloudflare-mudancas, cloudflare-conferir, publicar]
    if: needs.publicar.result == 'success' && needs.cloudflare-conferir.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEMETRY: ${{ needs.cloudflare-mudancas.outputs.telemetry }}
      MOBILE: ${{ needs.cloudflare-mudancas.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versao.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Antes do código: o Worker novo pode depender de uma coluna nova. Sem migração pendente, não faz nada.
      - name: Banco de dados do painel
        if: env.TELEMETRY == 'true'
        working-directory: apps/telemetry
        run: npx --yes "$WRANGLER" d1 migrations apply argus-telemetry --remote

      - name: Publicar o painel
        if: env.TELEMETRY == 'true'
        working-directory: apps/telemetry
        run: npx --yes "$WRANGLER" deploy

      - name: Instalar dependências do app do celular
        if: env.MOBILE == 'true'
        run: pnpm install --frozen-lockfile --filter "@argus/mobile..."

      # A ponte serve o app do celular (apps/relay/public, montado aqui).
      - name: Montar o app do celular
        if: env.MOBILE == 'true'
        run: pnpm mobile:build

      - name: Publicar a ponte e o app do celular
        if: env.MOBILE == 'true'
        working-directory: apps/relay
        run: npx --yes "$WRANGLER" deploy
