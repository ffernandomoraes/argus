# Gera uma versão nova: sobe o número no package.json, confere os tipos, monta o .dmg e o .zip
# (Apple Silicon), confere se o app abre, cria a tag e publica tudo num release do GitHub. Ao mesmo
# tempo, numa máquina Windows, monta o instalador .exe e confere se o app abre; quando os dois
# terminam, o .exe é anexado ao mesmo release.
# Roda sozinho a cada push na main (sobe o patch; notas = commits desde a última tag).
# Na mão, pela aba Actions ("Run workflow") ou: gh workflow run release.yml -f bump=minor -f notas="- item"
# Com publicar=false só monta e guarda o .dmg e o .exe no run, sem tag nem release.
name: Release

on:
  push:
    branches: [main]
    # Só texto (README, anotações): não vira versão.
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      bump:
        description: Que parte da versão subir
        type: choice
        options: [patch, minor, major]
        default: patch
      publicar:
        description: Publicar o release (desmarcado = só monta o app, para testar)
        type: boolean
        default: true
      notas:
        description: O que mudou, em tópicos ("- item" por linha). Vazio = lista os commits desde a última tag
        type: string
        default: ''

permissions:
  contents: write

# Um release por vez. Pushes que chegam durante um release esperam; se vierem vários, só o
# último fica na fila, e ele publica tudo de uma vez.
concurrency: release

jobs:
  # Escolhe o commit e o número da versão uma vez só, para o Mac e o Windows montarem o mesmo.
  versao:
    # O commit "Versão X" que este workflow envia não dispara outro release. O GitHub já não
    # dispara com pushes feitos pelo próprio Actions; isto é só a garantia.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Versão ') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      # No push não há as opções do disparo manual: sobe o patch.
      BUMP: ${{ inputs.bump || 'patch' }}
    steps:
      # A main como está agora, não a do push que disparou: um run que esperou na fila
      # pega o commit de versão do anterior e o que chegou depois.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Próxima versão
        id: version
        run: |
          next=$(node -e '
            const [major, minor, patch] = require("./package.json").version.split(".").map(Number)
            const bump = process.argv[1]
            console.log(bump === "major" ? `${major + 1}.0.0` : bump === "minor" ? `${major}.${minor + 1}.0` : `${major}.${minor}.${patch + 1}`)
          ' "$BUMP")
          if git rev-parse "v$next" >/dev/null 2>&1; then
            echo "A tag v$next já existe." >&2
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: versao
    runs-on: macos-15
    env:
      # No push não há as opções do disparo manual: publica sempre.
      PUBLICAR: ${{ github.event_name == 'push' || inputs.publicar }}
      VERSION: ${{ needs.versao.outputs.version }}
    steps:
      # O commit escolhido no job versao (fetch-depth: 0: as notas listam os commits desde a última tag).
      # persist-credentials: false: o token não fica no .git/config enquanto as dependências
      # instalam (um pacote com script poderia lê-lo); ele entra só no push da versão.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.versao.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Versão
        run: npm pkg set version="$VERSION"

      # O binário do Electron (baixado no postinstall e usado pelo electron-builder). Mudou o
      # lockfile, começa do zero: assim versões antigas do Electron não se acumulam no cache.
      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Conferir os tipos
        run: pnpm typecheck

      # O postinstall compila o programa do ditado (native/speech) e só avisa se falhar: sem ele,
      # o app sairia sem ditado no Mac.
      - name: Conferir o programa do ditado
        run: test -x native/speech/build/speech-helper

      # Com os secrets do certificado, o app sai assinado sempre com a mesma identidade e o macOS
      # não pede de novo microfone e ditado a cada versão. Sem eles, a montagem para (ver
      # scripts/sign.mjs): um release ad-hoc seria recusado pelo atualizador de todos os Macs.
      - name: Importar certificado de assinatura
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "Sem certificado: a montagem vai parar na assinatura (scripts/sign.mjs)."
            exit 0
          fi
          keychain="$RUNNER_TEMP/argus.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Certificado autoassinado: confiar nele para assinatura de código nesta máquina.
          security find-certificate -c "$MAC_SIGN_IDENTITY" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm "$RUNNER_TEMP/cert.p12"
          echo "MAC_SIGN_IDENTITY=$MAC_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Montar o app
        run: pnpm exec electron-vite build && pnpm exec electron-builder --mac --arm64 --publish never

      # Mesmo certificado em todas as versões = o macOS não pede as permissões de novo.
      - name: Conferir assinatura
        run: |
          codesign --verify --deep --strict dist/mac-arm64/Argus.app
          codesign -d -r- dist/mac-arm64/Argus.app 2>&1 | tee /dev/stderr | grep -qE 'certificate (leaf|root)'

      # Mesmo teste do job do Windows (--smoke-test, ver src/main/smokeTest.ts): abre o app, espera o
      # canvas, abre um terminal e fecha. Se não passar, não há tag nem release. O macOS não tem o
      # `timeout`: a espera de 3 minutos é feita aqui.
      - name: Testar se o app abre
        run: |
          dist/mac-arm64/Argus.app/Contents/MacOS/Argus --smoke-test &
          pid=$!
          for _ in $(seq 360); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid"
            cat "${TMPDIR:-/tmp}/argus-smoke.log" 2>/dev/null || true
            echo "O app não terminou o teste a tempo." >&2
            exit 1
          fi
          code=0
          wait "$pid" || code=$?
          cat "${TMPDIR:-/tmp}/argus-smoke.log" 2>/dev/null || true
          if [ "$code" -ne 0 ]; then
            echo "O app falhou no teste (código $code)." >&2
            exit 1
          fi

      - name: Guardar o app (teste)
        if: env.PUBLICAR != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Argus-${{ env.VERSION }}
          path: dist/*.dmg

      # --atomic: ou vão o commit e a tag juntos, ou nenhum dos dois. O token vai só neste push
      # (o checkout não o guardou): no endereço, sem ficar gravado no repositório.
      - name: Commit da versão e tag
        if: env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Versão $VERSION"
          git tag "v$VERSION"
          git push --atomic "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}" "refs/tags/v$VERSION"

      - name: Publicar release
        if: env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ inputs.notas }}
        run: |
          notas="$RUNNER_TEMP/notas.md"
          if [ -n "$NOTAS" ]; then
            printf '%s\n' "$NOTAS" > "$notas"
          else
            prev=$(git tag --sort=-v:refname | grep -vx "v$VERSION" | head -1)
            git log --format='- %s' "$prev..HEAD" | grep -v '^- Versão ' > "$notas" || echo "- Ajustes internos" > "$notas"
          fi
          gh release create "v$VERSION" \
            dist/*.dmg dist/*.zip \
            --title "Argus $VERSION" \
            --notes-file "$notas"

  # Instalador do Windows (.exe), numa máquina Windows do GitHub, ao mesmo tempo que o do Mac.
  # Antes de guardar, abre o app em modo de teste (--smoke-test, ver src/main/smokeTest.ts): se ele
  # nem abrir, o instalador não vai, e quem usa no Windows continua na versão anterior.
  windows:
    needs: versao
    runs-on: windows-latest
    # Ocupa a mesma fila dos releases (concurrency): travado, não pode segurar o próximo do Mac.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.versao.outputs.version }}
    steps:
      # O mesmo commit do Mac; a versão é trocada aqui (a tag só existe depois que o Mac publica).
      # Sem token no .git/config (ver o job do Mac): este job não faz push.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.versao.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Versão
        run: npm pkg set version="$VERSION"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Sem certificado de assinatura: o Windows avisa na primeira instalação (ver electron-builder.yml).
      - name: Montar o instalador
        run: pnpm exec electron-vite build && pnpm exec electron-builder --win --x64 --publish never

      - name: Testar se o app abre
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'dist\win-unpacked\Argus.exe' -ArgumentList '--smoke-test' -PassThru
          # Sem guardar o handle, o PowerShell perde o código de saída do processo.
          $null = $app.Handle
          $done = $app.WaitForExit(180000)
          Get-Content "$env:TEMP\argus-smoke.log" -ErrorAction SilentlyContinue
          if (-not $done) { $app.Kill(); throw 'O app não terminou o teste a tempo.' }
          if ($app.ExitCode -ne 0) { throw "O app falhou no teste (código $($app.ExitCode))." }

      # Publicando, o job anexar-windows pega daqui e a cópia some em 1 dia (o .exe fica no
      # release); testando, fica para baixar no run pelo prazo padrão do repositório (0).
      - name: Guardar o instalador
        uses: actions/upload-artifact@v6
        with:
          name: Argus-Setup-${{ env.VERSION }}
          path: dist/Argus-Setup-*.exe
          retention-days: ${{ (github.event_name == 'push' || inputs.publicar) && 1 || 0 }}

  # Anexa o .exe ao release que o job do Mac criou. Só roda se os dois deram certo: com o Mac
  # falhando não há release; com o Windows falhando, o release sai só com o Mac.
  anexar-windows:
    needs: [versao, release, windows]
    if: ${{ github.event_name == 'push' || inputs.publicar }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.versao.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Argus-Setup-${{ env.VERSION }}

      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" Argus-Setup-*.exe --clobber --repo "$GITHUB_REPOSITORY"
