# Publica o site do Argus (apps/website, Worker argus-website em argusterm.com) a cada push na main
# que mexe nele. Fica fora do release.yml de propósito: o site não depende da versão do app (o
# Download e as Novidades leem os releases do GitHub ao vivo), e mudança só no site não gera versão.
# Na mão: aba Actions ("Run workflow") ou gh workflow run website.yml.
name: Site

on:
  push:
    branches: [main]
    paths: ['apps/website/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; um push novo cancela o deploy antigo que ainda não terminou.
concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # O token da Cloudflare vai só nos passos que precisam dele, não na instalação do wrangler.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tools/wrangler/pnpm-lock.yaml

      - name: Secrets da Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID: o site não foi publicado."
            exit 1
          fi

      # O wrangler com o lockfile próprio (tools/wrangler, o mesmo do release.yml): versão e
      # dependências travadas, em vez de um baixado na hora pelo npx.
      - name: Instalar o wrangler
        run: |
          pnpm install --frozen-lockfile --dir tools/wrangler
          echo "$GITHUB_WORKSPACE/tools/wrangler/node_modules/.bin" >> "$GITHUB_PATH"

      # O build.mjs ([build] do wrangler.toml) monta o dist/ só com o que pode ir para o ar.
      - name: Publicar o site
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
