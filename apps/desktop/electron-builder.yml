appId: dev.argus.app
productName: Argus
copyright: Copyright © 2026 Fernando Moraes

directories:
  buildResources: build
  output: dist

files:
  - out/**
  # Mapas de código do app: vão só para o Sentry, no build (ver electron.vite.config.ts).
  - '!out/**/*.map'
  - package.json
  # O app usa o `claude` instalado na máquina; o binário que vem com o SDK (~200 MB) não entra.
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**'
  # Sobras da compilação do node-pty no Linux (só o pty.node é usado).
  - '!node_modules/node-pty/build/Release/obj.target/**'
  - '!node_modules/node-pty/build/Release/.deps/**'
  - '!node_modules/node-pty/build/**/*.mk'
  # Motor da transcrição de áudio (onnxruntime-node): o pacote traz binário de todos os sistemas
  # (~290 MB); cada build leva só o dele (ver mac/win/linux abaixo). Os scripts são do npm install.
  - '!node_modules/onnxruntime-node/script/**'
  # Mapas de código e tipos dos pacotes: só servem para quem desenvolve (~50 MB só os do Sentry).
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.d.ts'
  - '!node_modules/**/*.d.cts'
  - '!node_modules/**/*.d.mts'
  # Detector de travamento do Sentry: o pacote traz binários para o Node (que o Electron não carrega)
  # e as sobras da compilação; o app usa só o build/Release/stack-trace.node (scripts/sentryNative.mjs).
  - '!node_modules/@sentry/node-native-stacktrace/lib/*.node'
  - '!node_modules/@sentry/node-native-stacktrace/build/Release/obj.target/**'
  - '!node_modules/@sentry/node-native-stacktrace/build/Release/.deps/**'
  - '!node_modules/@sentry/node-native-stacktrace/build/**/*.mk'
  # Ferramentas de build que o SDK do Sentry traz como dependência (a CLI dele, o parser oxc e os
  # plugins de bundler): o app não carrega nenhuma (~20 MB).
  - '!node_modules/sentry/**'
  - '!node_modules/oxc-parser/**'
  - '!node_modules/@oxc-parser/**'
  - '!node_modules/@sentry/bundler-plugins/**'

# Só as traduções do Chromium em português e inglês (as outras ~200 somavam ~48 MB). Valem para
# os textos do próprio Chromium, como o menu do botão direito nos campos de texto.
electronLanguages:
  - pt_BR
  - pt-BR
  - en
  - en-US

# node-pty carrega .node e executa o spawn-helper: os dois precisam estar fora do asar. O
# onnxruntime-node (transcrição de áudio) carrega .node e a biblioteca do motor, também de fora.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/onnxruntime-node/**
  # O detector de travamento do Sentry carrega um .node (ver src/main/errorReports).
  - node_modules/@sentry/node-native-stacktrace/**

npmRebuild: false

mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  # Só o motor da transcrição do Mac ARM. O .node carrega o libonnxruntime.1.dylib; o
  # libonnxruntime.1.30.0.dylib é uma cópia igual (44 MB).
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/arm64/libonnxruntime.1.30.0.dylib'
  artifactName: Argus-${version}-${arch}.${ext}
  icon: build/icon.icns
  # A assinatura é feita no afterPack (scripts/afterPack.mjs -> sign.mjs), com certificado próprio ou ad-hoc.
  identity: null
  # Programa do ditado (native/speech), só no Mac. No Windows o microfone é gravado pela janela.
  extraResources:
    - from: native/speech/build/speech-helper
      to: speech-helper
  extendInfo:
    NSMicrophoneUsageDescription: O microfone é usado para ditar mensagens para o Claude.

# Windows: instalador de um clique, só para PCs Intel/AMD (os com processador ARM rodam por emulação).
# Sem certificado de assinatura (é pago por ano): na primeira instalação o Windows avisa que o
# programa não é reconhecido, e as atualizações seguintes, feitas pelo próprio app, não avisam.
win:
  target:
    - target: nsis
      arch: x64
  # Só o motor da transcrição do Windows x64.
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  icon: build/icon.ico

# Instala na pasta do usuário, sem pedir administrador, e abre o app no fim. O nome do arquivo é o
# que o atualizador procura no release (src/main/updater/releases.ts).
nsis:
  oneClick: true
  perMachine: false
  artifactName: Argus-Setup-${version}.${ext}
  shortcutName: Argus
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

# Linux: AppImage, um arquivo só que roda na maioria das distribuições (Ubuntu, Fedora, Debian...),
# sem instalar nada e sem administrador. Só PCs Intel/AMD. O nome do arquivo é o que o atualizador
# procura no release (src/main/updater/releases.ts).
linux:
  target:
    - target: AppImage
      arch: x64
  # Só o motor da transcrição do Linux x64.
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,win32}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/arm64/**'
  icon: build/icon.png
  category: Development
  artifactName: Argus-${version}-${arch}.${ext}
  executableName: argus
  synopsis: Canvas infinito para orquestrar projetos e agentes do Claude Code
  # O ícone das janelas e do atalho no menu de apps (ver app/linuxDesktop.ts): no Linux a janela não
  # pega o ícone do executável sozinha.
  extraResources:
    - from: build/icon.png
      to: icon.png

# Runtime novo do AppImage (estático): o antigo pedia a libfuse2, que o Ubuntu 22.04 em diante não
# traz instalada, e o AppImage nem abria. Ainda marcado como beta pelo electron-builder.
toolsets:
  appimage: '1.0.3'

# Assina o app do Mac e, no Linux, põe o lançador que cuida do sandbox (scripts/linuxLauncher.mjs).
afterPack: scripts/afterPack.mjs

dmg:
  title: Argus ${version}

publish: null
