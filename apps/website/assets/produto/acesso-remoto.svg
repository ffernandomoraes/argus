<rect x="914" y="386" width="212" height="50" rx="12" fill="#1a1a1a"/><circle cx="932" cy="411" r="5" fill="#3b82f6"/><text x="946" y="408" font-size="13">Escrever os testes</text><text x="946" y="425" font-size="11" style="fill:#5f5f5f">loja-web - trabalhando</text>
<rect x="914" y="444" width="212" height="50" rx="12" fill="#1a1a1a"/><circle cx="932" cy="469" r="5" fill="#1fbd53"/><text x="946" y="466" font-size="13">Ajustar o checkout</text><text x="946" y="483" font-size="11" style="fill:#5f5f5f">loja-web - concluída</text>
<rect x="914" y="584" width="212" height="38" rx="19" fill="none" stroke="#333"/><text x="930" y="608" font-size="13" style="fill:#5f5f5f">Pedir algo…</text>
<g fill="none" stroke="#979797" stroke-width="1.6" stroke-linecap="round"><rect x="1101" y="594" width="8" height="13" rx="4"/><path d="M1097 603a8 8 0 0 0 16 0M1105 611v4"/></g>
