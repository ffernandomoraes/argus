<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Ilustração do acesso remoto: o Argus de casa aberto no notebook e no celular">
<title>Ilustração do acesso remoto: o Argus de casa aberto no notebook e no celular</title>
<defs>
<pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2a2a2a"/></pattern>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#cfcfcf}.m{font-family:ui-monospace,Menlo,Consolas,monospace}</style>
</defs>
<rect width="1200" height="750" fill="#101010"/>
<!-- janela do notebook -->
<rect x="60" y="120" width="720" height="500" rx="14" fill="#141414" stroke="#333"/>
<path d="M74 120h692a14 14 0 0 1 14 14v26H60v-26a14 14 0 0 1 14-14z" fill="#1f4fae"/>
<circle cx="82" cy="140" r="5" fill="#fff" fill-opacity=".35"/><circle cx="98" cy="140" r="5" fill="#fff" fill-opacity=".35"/><circle cx="114" cy="140" r="5" fill="#fff" fill-opacity=".35"/>
<rect x="132" y="129" width="100" height="22" rx="5" fill="#fff" fill-opacity=".16"/><text x="182" y="145" font-size="13" text-anchor="middle" style="fill:#fff">Mac de casa</text>
<text x="764" y="145" font-size="12" text-anchor="end" class="m" style="fill:#fff;fill-opacity:.85">2 conectados</text>
<rect x="61" y="160" width="718" height="459" fill="url(#d)"/>
<rect x="92" y="190" width="320" height="300" rx="12" fill="none" stroke="#3a3a3a" stroke-dasharray="5 4"/>
<text x="108" y="214" font-size="12" class="m" style="fill:#d77552;letter-spacing:1px">TRABALHO</text>
<rect x="108" y="228" width="288" height="138" rx="10" fill="#1a1a1a" stroke="#333"/>
<text x="124" y="254" font-size="16">loja-web</text>
<rect x="122" y="268" width="260" height="34" rx="7" fill="#222"/><circle cx="138" cy="285" r="5" fill="#3b82f6"/><text x="152" y="290" font-size="14">Escrever os testes</text>
<rect x="122" y="312" width="260" height="34" rx="7" fill="#222"/><circle cx="138" cy="329" r="5" fill="#1fbd53"/><text x="152" y="334" font-size="14">Ajustar o checkout</text>
<rect x="108" y="380" width="288" height="94" rx="10" fill="#1a1a1a" stroke="#333"/>
<text x="124" y="406" font-size="16">api</text>
<rect x="122" y="420" width="260" height="34" rx="7" fill="#222"/><circle cx="138" cy="437" r="5" fill="#f5a524"/><text x="152" y="442" font-size="14">Rodar as migrações</text>
<rect x="440" y="500" width="310" height="86" rx="10" fill="#0b0b0b" stroke="#333"/>
<text x="458" y="534" font-size="14" class="m">$ pnpm dev</text>
<text x="458" y="562" font-size="14" class="m" style="fill:#1fbd53">➜ Local: http://localhost:5173</text>
<!-- conexão -->
<line x1="790" y1="370" x2="880" y2="370" stroke="#555" stroke-dasharray="5 4"/>
<circle cx="835" cy="370" r="20" fill="#1a1a1a" stroke="#333"/>
<g fill="none" stroke="#d77552" stroke-width="2" stroke-linecap="round"><rect x="826" y="368" width="18" height="12" rx="2"/><path d="M830 368v-4a5 5 0 0 1 10 0v4"/></g>
<!-- celular -->
<rect x="890" y="90" width="260" height="560" rx="38" fill="#0c0c0c" stroke="#3a3a3a"/>
<rect x="900" y="100" width="240" height="540" rx="30" fill="#151515"/>
<rect x="982" y="112" width="76" height="22" rx="11" fill="#000"/>
