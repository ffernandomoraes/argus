<rect x="914" y="192" width="212" height="58" rx="12" fill="#1a1a1a" stroke="#262626"/>
<text x="926" y="214" font-size="12" style="fill:#979797">Claude - limite de 5 h</text><text x="1114" y="214" font-size="12" text-anchor="end" style="fill:#979797">42%</text>
<rect x="926" y="228" width="188" height="6" rx="3" fill="#2a2a2a"/><rect x="926" y="228" width="79" height="6" rx="3" fill="#1fbd53"/>
<rect x="914" y="262" width="212" height="54" rx="14" fill="#262626" stroke="#3a3a3a"/>
