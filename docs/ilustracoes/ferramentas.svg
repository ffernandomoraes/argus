<text x="317.2" y="105" font-size="12.5" class="tx mono" xml:space="preserve"> { REGIOES } </text>
<text x="415.1" y="105" font-size="12.5" class="mono" xml:space="preserve" style="fill:#c678dd">from</text>
<text x="445.2" y="105" font-size="12.5" class="mono" xml:space="preserve" style="fill:#16a34a"> './regioes'</text>
