<text x="272.0" y="153" font-size="12.5" class="mono" xml:space="preserve" style="fill:#c678dd">export function</text>
<text x="384.9" y="153" font-size="12.5" class="mono" xml:space="preserve" style="fill:#2563eb"> calcularFrete</text>
<text x="490.4" y="153" font-size="12.5" class="tx mono" xml:space="preserve">(pedido: Pedido) {</text>
<text x="256" y="177" font-size="12" class="fa mono" text-anchor="end">5</text>
<text x="272.0" y="177" font-size="12.5" class="mono" xml:space="preserve" style="fill:#c678dd">  const</text>
<text x="324.7" y="177" font-size="12.5" class="tx mono" xml:space="preserve"> regiao = REGIOES[pedido.uf]</text>
<text x="256" y="201" font-size="12" class="fa mono" text-anchor="end">6</text>
<text x="272.0" y="201" font-size="12.5" class="mono" xml:space="preserve" style="fill:#c678dd">  const</text>
<text x="324.7" y="201" font-size="12.5" class="tx mono" xml:space="preserve"> porPeso = pedido.peso * regiao.taxa</text>
<text x="256" y="225" font-size="12" class="fa mono" text-anchor="end">7</text>
<text x="272.0" y="225" font-size="12.5" class="mono" xml:space="preserve" style="fill:#c678dd">  return</text>
<text x="332.2" y="225" font-size="12.5" class="tx mono" xml:space="preserve"> Math.max(porPeso, regiao.minimo)</text>
<text x="256" y="249" font-size="12" class="fa mono" text-anchor="end">8</text>
<text x="272.0" y="249" font-size="12.5" class="tx mono" xml:space="preserve">}</text>
