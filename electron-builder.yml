appId: dev.argus.app
productName: Argus
copyright: Copyright © 2026 Fernando Moraes

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  # O app usa o `claude` instalado na máquina; o binário que vem com o SDK (~200 MB) não entra.
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**'

# Só as traduções do Chromium em português e inglês (as outras ~200 somavam ~48 MB). Valem para
# os textos do próprio Chromium, como o menu do botão direito nos campos de texto.
electronLanguages:
  - pt_BR
  - pt-BR
  - en
  - en-US

# node-pty carrega .node e executa o spawn-helper: os dois precisam estar fora do asar.
asarUnpack:
  - node_modules/node-pty/**

npmRebuild: false

mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  artifactName: Argus-${version}-${arch}.${ext}
  icon: build/icon.icns
  # A assinatura é feita no afterPack (scripts/sign.mjs), com certificado próprio ou ad-hoc.
  identity: null
  # Programa do ditado (native/speech), só no Mac. No Windows o microfone é gravado pela janela.
  extraResources:
    - from: native/speech/build/speech-helper
      to: speech-helper
  extendInfo:
    NSMicrophoneUsageDescription: O microfone é usado para ditar mensagens para o Claude.
    NSSpeechRecognitionUsageDescription: O reconhecimento de fala transforma o que você diz em texto no campo da conversa.

# Windows: instalador de um clique, só para PCs Intel/AMD (os com processador ARM rodam por emulação).
# Sem certificado de assinatura (é pago por ano): na primeira instalação o Windows avisa que o
# programa não é reconhecido, e as atualizações seguintes, feitas pelo próprio app, não avisam.
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico

# Instala na pasta do usuário, sem pedir administrador, e abre o app no fim. O nome do arquivo é o
# que o atualizador procura no release (src/main/updater.ts).
nsis:
  oneClick: true
  perMachine: false
  artifactName: Argus-Setup-${version}.${ext}
  shortcutName: Argus
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

afterPack: scripts/sign.mjs

dmg:
  title: Argus ${version}

publish: null
