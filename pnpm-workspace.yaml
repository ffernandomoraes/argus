allowBuilds:
  # Compilado para o Electron por scripts/sentryNative.mjs; o script do pacote compilaria para o Node.
  '@sentry/node-native-stacktrace': false
  electron-winstaller: false
  esbuild: true
  node-pty: false
  onnxruntime-node: false
  protobufjs: false
minimumReleaseAgeExclude:
  - vite@7.3.7
overrides:
  # GHSA-rxp7-6hxx-x8q5; vem do claude-agent-sdk. Remover quando o SDK já trouxer >=10.7.4.
  ip-address: ^10.7.4
  # Alertas do Dependabot de 2026-10-30; o pnpm update não sobe dependência indireta presa pelo pai.
  # undici vem do electron (@electron/get) e do node-gyp; qs, do express do @modelcontextprotocol/sdk;
  # fast-uri, do ajv. Remover quando os pais já trouxerem essas versões.
  undici@6: ^6.29.1
  undici@7: ^7.30.1
  qs: ^6.16.1
  fast-uri: ^3.1.9
  # Alertas do Dependabot de 2026-11-12 (GHSA-g3hv-75wg-m249 e GHSA-3g3m-2fjr-6pw4): a correção só
  # existe na versão maior seguinte. minimatch vem do electron-builder (@electron/universal,
  # app-builder-lib) e glob do @sentry/bundler-plugins; os dois usam só minimatch/Minimatch e glob,
  # iguais nas versões novas. Versões fixas, de duas semanas atrás (não as publicadas ontem). Remover quando os pais já trouxerem minimatch >=11.0.1 e glob >=14.0.2.
  'minimatch@>=7.0.0 <12.0.0': 11.0.3
  'glob@>=9.0.0 <14.0.2': 14.0.3
