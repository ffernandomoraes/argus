allowBuilds:
  # Compilado para o Electron por scripts/sentryNative.mjs; o script do pacote compilaria para o Node.
  '@sentry/node-native-stacktrace': false
  electron-winstaller: false
  esbuild: true
  node-pty: false
  onnxruntime-node: false
  protobufjs: false
minimumReleaseAgeExclude:
  - vite@7.3.7
overrides:
  # GHSA-rxp7-6hxx-x8q5; vem do claude-agent-sdk. Remover quando o SDK já trouxer >=10.7.4.
  ip-address: ^10.7.4
  # Alertas do Dependabot de 2026-10-30; o pnpm update não sobe dependência indireta presa pelo pai.
  # undici vem do electron (@electron/get) e do node-gyp; qs, do express do @modelcontextprotocol/sdk;
  # fast-uri, do ajv. Remover quando os pais já trouxerem essas versões.
  undici@6: ^6.29.1
  undici@7: ^7.30.1
  qs: ^6.16.1
  fast-uri: ^3.1.9
