<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus - uso</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f5f4;
  --surface: #ffffff;
  --border: #e5e5e3;
  --grid: #ececea;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #8a8985;
  --fill: #f0f0ee;
  --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --bar: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #2c2c2a; --grid: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c85; --fill: #232321;
    --accent: #3987e5; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --bar: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --border: #2c2c2a; --grid: #262624;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c85; --fill: #232321;
  --accent: #3987e5; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --bar: #3987e5;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--text-3); font-size: 13px; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: var(--fill); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13px;
  padding: 5px 12px; border-radius: 8px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 28px 0 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.kpi .label { color: var(--text-2); font-size: 13px; }
.kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .note { color: var(--text-3); font-size: 12px; margin-top: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px 16px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h3 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.card .desc { color: var(--text-3); font-size: 12.5px; margin-bottom: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 200px; overflow: visible; }
.axis { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.hit { fill: transparent; cursor: default; }
.hit:hover + .col-hover, .col-hover.on { opacity: 1; }
.col-hover { fill: var(--fill); opacity: 0; pointer-events: none; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.14);
  white-space: nowrap; z-index: 5; display: none;
}
.tip b { font-weight: 600; }
.tip .row { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.tip .row span:last-child { margin-left: auto; padding-left: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
.tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.bars { display: flex; flex-direction: column; gap: 7px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 38%) 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.bar-row .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 10px; background: var(--fill); border-radius: 4px; overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .val { color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.badge { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.empty { color: var(--text-3); font-size: 13px; padding: 8px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: right; font-weight: 500; color: var(--text-3); padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td:first-child { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.table-scroll { overflow-x: auto; }
.agent-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; vertical-align: 0; }
details { margin-top: 10px; font-size: 13px; color: var(--text-2); }
details summary { cursor: pointer; color: var(--text-3); }
.error { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; color: var(--text-2); }
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr; }
  .kpi .value { font-size: 22px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Argus - uso</h1>
      <div class="sub" id="updated">Carregando...</div>
    </div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Período" id="period">
      <button data-days="7">7 dias</button>
      <button data-days="30">30 dias</button>
      <button data-days="90">90 dias</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<script>
(function () {
  'use strict'
  // Cor fixa por agente (nunca pela posição no ranking).
  var AGENTS = ['claude', 'codex', 'gemini', 'cursor']
  var AGENT_NAME = { claude: 'Claude', codex: 'Codex', gemini: 'Gemini', cursor: 'Cursor' }
  var AGENT_COLOR = { claude: 'var(--s1)', codex: 'var(--s2)', gemini: 'var(--s3)', cursor: 'var(--s4)' }
  var OS_NAME = { macos: 'macOS', windows: 'Windows', linux: 'Linux' }
  var nf = new Intl.NumberFormat('pt-BR')
  var cf = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 })
  var usd = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 })
  var pct = new Intl.NumberFormat('pt-BR', { style: 'percent', maximumFractionDigits: 0 })

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] })
  }
  function minutes(m) {
    if (!m) return '0 min'
    if (m < 60) return Math.round(m) + ' min'
    var h = Math.floor(m / 60), r = Math.round(m % 60)
    return h + ' h' + (r ? ' ' + r + ' min' : '')
  }
  function shortDay(d) { var p = d.split('-'); return p[2] + '/' + p[1] }

  var days = 30
  try { days = Number(localStorage.getItem('argus-usage-days')) || 30 } catch (e) {}
  if ([7, 30, 90].indexOf(days) < 0) days = 30

  var seg = document.getElementById('period')
  seg.addEventListener('click', function (e) {
    var b = e.target.closest('button')
    if (!b) return
    days = Number(b.getAttribute('data-days'))
    try { localStorage.setItem('argus-usage-days', String(days)) } catch (err) {}
    load()
  })

  function load() {
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-days')) === days))
    })
    fetch('/api/summary?days=' + days, { credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() })
      .then(render)
      .catch(function (err) {
        document.getElementById('main').innerHTML = '<div class="error">Não deu para carregar os números (' + esc(err.message) + ').</div>'
      })
  }

  // --- Peças ---

  function kpi(label, value, note) {
    return '<div class="kpi"><div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + '</div>' +
      (note ? '<div class="note">' + esc(note) + '</div>' : '') + '</div>'
  }

  function card(title, desc, body, wide) {
    return '<section class="card' + (wide ? ' wide' : '') + '"><h3>' + esc(title) + '</h3>' +
      (desc ? '<div class="desc">' + esc(desc) + '</div>' : '') + body + '</section>'
  }

  // Ranking em barras horizontais, com o número escrito ao lado (não depende da cor).
  function bars(items, fmt, opts) {
    opts = opts || {}
    if (!items.length) return '<div class="empty">Sem dados no período.</div>'
    var max = Math.max.apply(null, items.map(function (i) { return i.value })) || 1
    var total = items.reduce(function (a, i) { return a + i.value }, 0) || 1
    return '<div class="bars">' + items.map(function (i) {
      var name = opts.name ? opts.name(i.key) : i.key
      var color = opts.color ? opts.color(i.key) : null
      var share = opts.share ? ' (' + pct.format(i.value / total) + ')' : ''
      return '<div class="bar-row" title="' + esc(name + ': ' + (fmt || nf.format)(i.value) + share) + '">' +
        '<div class="name">' + esc(name) + (opts.badge && opts.badge(i.key) ? '<span class="badge">' + esc(opts.badge(i.key)) + '</span>' : '') + '</div>' +
        '<div class="track"><div class="fill" style="width:' + (i.value / max * 100).toFixed(1) + '%' + (color ? ';background:' + color : '') + '"></div></div>' +
        '<div class="val">' + esc((fmt || nf.format)(i.value) + share) + '</div></div>'
    }).join('') + '</div>'
  }

  // Colunas por dia, empilhadas por série. series: [{ key, name, color, get(day) }]
  var charts = []
  function columns(data, series, fmt) {
    var id = 'c' + charts.length
    charts.push({ id: id, data: data, series: series, fmt: fmt || nf.format })
    var legend = series.length > 1
      ? '<div class="legend">' + series.map(function (s) { return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>' }).join('') + '</div>'
      : ''
    return legend + '<div class="chart" id="' + id + '"></div>'
  }

  function niceMax(v) {
    if (v <= 0) return 1
    var p = Math.pow(10, Math.floor(Math.log10(v)))
    var steps = [1, 2, 2.5, 5, 10]
    for (var i = 0; i < steps.length; i++) if (steps[i] * p >= v) return steps[i] * p
    return 10 * p
  }

  function drawColumns(c) {
    var el = document.getElementById(c.id)
    if (!el) return
    var W = el.clientWidth || 600, H = 200, padL = 44, padB = 22, padT = 8
    var n = c.data.length
    var totals = c.data.map(function (d) { return c.series.reduce(function (a, s) { return a + s.get(d) }, 0) })
    var max = niceMax(Math.max.apply(null, totals))
    var plotW = W - padL, plotH = H - padB - padT
    var slot = plotW / n
    var gap = 2
    var bw = Math.max(2, Math.min(28, slot - Math.max(2, slot * 0.25)))
    var y = function (v) { return padT + plotH - (v / max) * plotH }
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">'
    for (var g = 0; g <= 4; g++) {
      var gv = max * g / 4, gy = y(gv)
      svg += '<line class="gridline" x1="' + padL + '" x2="' + W + '" y1="' + gy + '" y2="' + gy + '"/>'
      svg += '<text class="axis" x="' + (padL - 8) + '" y="' + (gy + 4) + '" text-anchor="end">' + esc(cf.format(gv)) + '</text>'
    }
    var labelEvery = Math.ceil(n / Math.max(1, Math.floor(plotW / 48)))
    c.data.forEach(function (d, i) {
      var x0 = padL + i * slot
      var x = x0 + (slot - bw) / 2
      svg += '<rect class="hit" data-i="' + i + '" x="' + x0 + '" y="' + padT + '" width="' + slot + '" height="' + plotH + '"/>'
      svg += '<rect class="col-hover" x="' + x0 + '" y="' + padT + '" width="' + slot + '" height="' + plotH + '" rx="4"/>'
      var base = 0
      var visible = c.series.filter(function (s) { return s.get(d) > 0 })
      visible.forEach(function (s, k) {
        var v = s.get(d)
        var top = y(base + v), bottom = y(base)
        var h = Math.max(0, bottom - top - (base > 0 ? gap : 0))
        var last = k === visible.length - 1
        if (h > 0) {
          if (last) {
            var r = Math.min(4, h, bw / 2)
            svg += '<path pointer-events="none" fill="' + s.color + '" d="M' + x + ',' + (top + h) + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top +
              'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + 'V' + (top + h) + 'Z"/>'
          } else {
            svg += '<rect pointer-events="none" fill="' + s.color + '" x="' + x + '" y="' + top + '" width="' + bw + '" height="' + h + '"/>'
          }
        }
        base += v
      })
      if (i % labelEvery === 0) svg += '<text class="axis" x="' + (x0 + slot / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' + esc(shortDay(d.day)) + '</text>'
    })
    svg += '</svg><div class="tip"></div>'
    el.innerHTML = svg
    var tip = el.querySelector('.tip')
    var svgEl = el.querySelector('svg')
    svgEl.addEventListener('mousemove', function (e) {
      var t = e.target
      if (!t.classList.contains('hit')) { tip.style.display = 'none'; return }
      var d = c.data[Number(t.getAttribute('data-i'))]
      var rows = c.series.map(function (s) {
        return '<div class="row">' + (c.series.length > 1 ? '<i style="background:' + s.color + '"></i>' : '') + '<span>' + esc(s.name) + '</span><span>' + esc(c.fmt(s.get(d))) + '</span></div>'
      }).join('')
      tip.innerHTML = '<b>' + esc(shortDay(d.day)) + '</b>' + rows
      tip.style.display = 'block'
      var box = el.getBoundingClientRect()
      var left = e.clientX - box.left + 14
      if (left + tip.offsetWidth > box.width) left = e.clientX - box.left - tip.offsetWidth - 14
      tip.style.left = Math.max(0, left) + 'px'
      tip.style.top = Math.max(0, e.clientY - box.top - tip.offsetHeight / 2) + 'px'
    })
    svgEl.addEventListener('mouseleave', function () { tip.style.display = 'none' })
  }

  // --- Página ---

  function render(s) {
    charts = []
    var t = s.totals
    document.getElementById('updated').textContent =
      'Desde ' + shortDay(s.since) + ' - ' + nf.format(t.installsAllTime) + ' instalações desde o começo - atualizado ' +
      new Date(s.generatedAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })

    var latestShare = 0
    if (s.latestVersion) {
      var onLatest = (s.versions.filter(function (v) { return v.key === s.latestVersion })[0] || { value: 0 }).value
      var all = s.versions.reduce(function (a, v) { return a + v.value }, 0)
      latestShare = all ? onLatest / all : 0
    }

    var h = ''
    h += '<div class="kpis">' +
      kpi('Instalações ativas', nf.format(t.installs), nf.format(t.newInstalls) + ' novas no período') +
      kpi('Tempo médio por dia', minutes(t.avgMinutesPerDay), 'por instalação, nos dias com uso') +
      kpi('Tempo total de uso', minutes(t.activeMinutes), 'janela em foco ou conversa rodando') +
      kpi('Conversas criadas', nf.format(t.chats), nf.format(t.messages) + ' mensagens enviadas') +
      kpi('Tokens', cf.format(t.tokens), nf.format(t.turns) + ' pedidos aos agentes') +
      kpi('Custo estimado', usd.format(t.costUsd), 'só Claude, preço de tabela') +
      kpi('Na última versão', pct.format(latestShare), s.latestVersion ? 'v' + s.latestVersion : '') +
      '</div>'

    h += '<h2>Atividade</h2><div class="grid">'
    h += card('Instalações ativas por dia', 'Quantas instalações usaram o Argus em cada dia.',
      columns(s.daily, [{ key: 'i', name: 'Instalações', color: 'var(--s1)', get: function (d) { return d.installs } }]), true)
    h += card('Tempo de uso por dia', 'Soma de todas as instalações: janela em foco ou alguma conversa rodando.',
      columns(s.daily, [{ key: 'm', name: 'Tempo de uso', color: 'var(--s1)', get: function (d) { return d.minutes } }], minutes))
    h += card('Instalações novas por dia', 'Primeiro dia em que cada instalação mandou dados.',
      columns(s.daily, [{ key: 'n', name: 'Novas', color: 'var(--s1)', get: function (d) { return d.newInstalls } }]))
    h += '</div>'

    var usedAgents = AGENTS.filter(function (a) { return s.daily.some(function (d) { return (d.tokens[a] || 0) > 0 }) })
    h += '<h2>Agentes e modelos</h2><div class="grid">'
    h += card('Tokens por dia', 'Entrada, saída e cache somados, por agente. Gemini e Cursor não informam tokens.',
      usedAgents.length
        ? columns(s.daily, usedAgents.map(function (a) { return { key: a, name: AGENT_NAME[a], color: AGENT_COLOR[a], get: function (d) { return d.tokens[a] || 0 } } }), cf.format)
        : '<div class="empty">Sem tokens no período.</div>', true)
    h += card('Conversas criadas por agente', '', bars(s.chatsByAgent, nf.format, { name: function (k) { return AGENT_NAME[k] || k }, color: function (k) { return AGENT_COLOR[k] }, share: true }))
    h += card('Mensagens enviadas por agente', '', bars(s.messagesByAgent, nf.format, { name: function (k) { return AGENT_NAME[k] || k }, color: function (k) { return AGENT_COLOR[k] }, share: true }))

    var modelRows = s.models.length
      ? '<div class="table-scroll"><table><thead><tr><th>Modelo</th><th>Pedidos</th><th>Entrada</th><th>Saída</th><th>Cache lido</th><th>Cache gravado</th><th>Custo</th></tr></thead><tbody>' +
        s.models.map(function (m) {
          return '<tr><td title="' + esc(m.key) + '"><span class="agent-dot" style="background:' + (AGENT_COLOR[m.agent] || 'var(--text-3)') + '"></span>' + esc(m.model) +
            ' <span class="sub">' + esc(AGENT_NAME[m.agent] || m.agent) + '</span></td>' +
            '<td>' + nf.format(m.turns) + '</td><td>' + cf.format(m.input) + '</td><td>' + cf.format(m.output) + '</td><td>' + cf.format(m.cacheRead) +
            '</td><td>' + cf.format(m.cacheWrite) + '</td><td>' + (m.agent === 'claude' ? usd.format(m.costUsd) : '-') + '</td></tr>'
        }).join('') + '</tbody></table></div>'
      : '<div class="empty">Sem pedidos no período.</div>'
    h += card('Modelos mais usados', 'Ordenados por pedidos.', modelRows, true)
    h += card('Ferramentas mais chamadas', 'Pelo Claude. As de MCP contam juntas, sem o nome do servidor.', bars(s.tools, nf.format))
    h += card('Agentes conectados', 'Instalações com alguma conta de cada agente além do Claude.', bars(s.providers, nf.format, { name: function (k) { return AGENT_NAME[k] || k }, color: function (k) { return AGENT_COLOR[k] } }))
    h += card('Plano do Claude', 'Contas logadas, pelo tipo de assinatura.', bars(s.plans, nf.format, { share: true }))
    h += '</div>'

    var sn = s.snapshot
    h += '<h2>O Argus como um todo</h2>'
    h += '<div class="kpis">' +
      kpi('Workspaces', nf.format(sn.workspaces), nf.format(t.workspacesCreated) + ' criados no período') +
      kpi('Pastas importadas', nf.format(sn.folders), sn.installs ? cf.format(sn.folders / sn.installs) + ' por instalação' : '') +
      kpi('Worktrees', nf.format(sn.worktrees), nf.format(t.worktreesCreated) + ' criadas no período') +
      kpi('Grupos', nf.format(sn.groups), '') +
      kpi('Cards de conversa', nf.format(sn.chatCards), 'soltos no canvas') +
      kpi('Terminais', nf.format(sn.terminals), '') +
      kpi('Notas', nf.format(sn.notes), '') +
      kpi('Aberturas do app', nf.format(t.appOpens), 'no período') +
      kpi('Acesso remoto', nf.format(s.remoteAccess), 'instalações hospedando') +
      '</div>'
    h += '<div class="desc" style="margin-top:8px;color:var(--text-3);font-size:12.5px">O que cada instalação ativa no período tinha no último dia em que mandou dados.</div>'

    h += '<h2>Instalações</h2><div class="grid">'
    h += card('Sistema operacional', '', bars(s.os, nf.format, { name: function (k) { return OS_NAME[k] || k }, share: true }) +
      (s.wsl ? '<details><summary>WSL</summary>' + nf.format(s.wsl) + ' instalações no Windows com WSL.</details>' : ''))
    h += card('Versão do sistema', '', bars(s.osVersions.slice(0, 10), nf.format, { name: function (k) { var p = k.split(' '); return (OS_NAME[p[0]] || p[0]) + ' ' + p.slice(1).join(' ') }, share: true }))
    h += card('Versão do Argus', 'Pela versão mais recente de cada instalação.', bars(s.versions.slice(0, 10), nf.format, {
      name: function (k) { return 'v' + k }, share: true, badge: function (k) { return k === s.latestVersion ? 'última' : '' }
    }))
    h += card('Versão do Claude Code', '', bars(s.claudeCode, nf.format, { share: true }))
    h += card('Idioma do app', '', bars(s.languages, nf.format, { name: function (k) { return { pt: 'Português', en: 'Inglês' }[k] || k }, share: true }))
    h += card('Arquitetura', '', bars(s.arch, nf.format, { share: true }))
    var ret = s.retention.map(function (r) {
      return { key: r.day === 1 ? 'Voltou no dia seguinte' : 'Voltou depois de ' + r.day + ' dias', value: r.eligible ? r.returned / r.eligible : 0, eligible: r.eligible }
    })
    h += card('Retenção', 'Desde sempre: das instalações com idade suficiente, quantas usaram de novo depois de N dias.',
      ret.every(function (r) { return !r.eligible }) ? '<div class="empty">Ainda sem instalações com idade suficiente.</div>'
        : bars(ret, function (v) { return pct.format(v) }))
    h += '</div>'

    document.getElementById('main').innerHTML = h
    charts.forEach(drawColumns)
  }

  var resizeTimer
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(function () { charts.forEach(drawColumns) }, 120)
  })

  load()
})()
</script>
</body>
</html>
